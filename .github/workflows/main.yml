name: Deploy React App

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted

    env:
      DEPLOY_PATH: /var/www/html

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Clear old deployment
        run: rm -rf ${{ env.DEPLOY_PATH }}/*

      - name: Copy new build to deploy path
        run: cp -r dist/* ${{ env.DEPLOY_PATH }}/

      - name: Deployment summary
        run: echo "✅ Deployed commit ${{ github.sha }} to ${{ env.DEPLOY_PATH }}"
